[files]
extend-exclude = [
    ".git",
    "target",
    "testdata",
    "Cargo.toml",
    "Cargo.lock",
    "CHANGELOG.md",
    "*.json",
    "**/tests/**",
    "**/test/**",
    "**/*_test.*",
    "**/*_tests.*",
    "crates/parse/src/lexer/unicode_chars.rs",
    "dist-workspace.toml",
    # PADS.md is the harness contract spec; it intentionally uses words
    # like `mis-localized` that the default typos dictionary flags. The
    # spec wording is reviewed separately from the Solar codebase.
    "PADS.md",
]

[default.extend-words]
ket = "ket"
numer = "numer"
